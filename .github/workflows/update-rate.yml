name: Atualizar câmbio USD/MXN

on:
  schedule:
    # 12:07 UTC = 09:07 America/Sao_Paulo (fora do topo da hora, evita congestionamento do agendador do GitHub)
    - cron: '7 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Buscar cotação mais recente e atualizar página
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: python3 scripts/update_rate.py

      - name: Commitar alterações (se houver)
        run: |
          git config user.name "cambio-bot"
          git config user.email "actions@github.com"
          if git diff --quiet; then
            echo "Nada para commitar."
          else
            git add data.json index.html
            git commit -m "Atualiza cotação USD/MXN $(date -u +%Y-%m-%d)"
            git push
          fi
