name: Fetch DOF exchange rate

on:
  schedule:
    # 20:00 UTC = 14:00 Cidade do México (UTC-6, sem horário de verão desde 2022)
    - cron: '0 20 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Buscar cotação no DOF
        run: python3 scripts/fetch_rate.py

      - name: Commitar se houve mudança
        run: |
          git config user.name "dof-rate-bot"
          git config user.email "actions@github.com"
          git add latest-rate.json
          if git diff --cached --quiet; then
            echo "Sem mudanças (mesma cotação/data já registrada)."
          else
            git commit -m "Atualiza cotação DOF ($(date -u +%Y-%m-%d))"
            git push
          fi
